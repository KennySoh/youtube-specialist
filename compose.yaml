# Used by ./scripts/yt.sh (scripts/yt.sh). Data stays on the host; .env sets the limits.
services:
  yt:
    build: pipelines/video-pipeline
    image: my-ai-brain-yt
    user: "1000:1000"
    volumes:
      - ./knowledge-library/youtube:/library
      - ./raw/youtube:/raw
      - ${HOME}/Downloads:/downloads        # ./scripts/yt.sh import reads bookmarklet files from here
      - /etc/localtime:/etc/localtime:ro    # same day boundary for the daily budget as the host
    environment:
      YT_DOWNLOADS: /downloads
    env_file:
      - path: .env
        required: false
