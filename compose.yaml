# Used by ./scripts/yt.sh (scripts/yt.sh). Data stays on the host; .env sets the limits.
services:
  yt:
    build: knowledge-acquisition/pipelines/video-pipeline
    image: myaimentors-yt
    user: "1000:1000"
    volumes:
      - ./knowledge-library/youtube:/library                  # published transcripts (what experts read)
      - ./knowledge-acquisition/raw/youtube:/raw              # caption snapshots
      - ./knowledge-acquisition/state/youtube:/state          # guard, lock, videos.json, status.json
      - ${HOME}/Downloads:/downloads        # ./scripts/yt.sh import reads bookmarklet files from here
      - /etc/localtime:/etc/localtime:ro    # same day boundary for the daily budget as the host
    environment:
      YT_DOWNLOADS: /downloads
    env_file:
      - path: .env
        required: false
